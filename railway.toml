# Railway PaaS deployment configuration.
# This file defines build/start behavior only.
# Runtime variables such as DB_JDBC_URL, DB_USERNAME, DB_PASSWORD,
# JWT_SECRET, CORS_ALLOWED_ORIGINS and H2_CONSOLE_ENABLED should be
# set in the Railway service Variables tab.

[build]
builder = "NIXPACKS"
buildCommand = "mvn clean package -DskipTests"

[deploy]
startCommand = "java -jar target/ev-charging-backend-1.0.0.jar --server.port=$PORT"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
