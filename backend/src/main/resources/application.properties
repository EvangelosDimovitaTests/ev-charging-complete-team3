# Local port, or the platform PORT value in deployment
server.port=${PORT:8080}

spring.application.name=ev-charging-backend

# H2 is used locally by default. In deployment these values are replaced
# with PostgreSQL settings from the platform environment variables.
spring.datasource.url=${DB_JDBC_URL:jdbc:h2:mem:evcharging;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# Hibernate creates/updates the schema for this academic prototype.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=${HIBERNATE_DIALECT:org.hibernate.dialect.H2Dialect}

# H2 console is for local development only.
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console

# JWT settings
app.jwt.secret=${JWT_SECRET:ev-charging-super-secret-key-change-in-production-minimum-256-bits}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Used in request logs so different deployed instances can be identified.
app.instance.id=${INSTANCE_ID:${random.uuid}}

# Local frontend origins. In deployment this should be set to the deployed frontend URL.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500,http://localhost:3000,http://localhost:8080}

logging.level.com.evcharging=DEBUG
logging.level.org.springframework.security=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
